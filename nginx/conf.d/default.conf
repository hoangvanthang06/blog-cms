# ==============================================================
# NGINX REVERSE PROXY & HARDENING CONFIGURATION
# Sinh viên: Hoàng Văn Thắng - MSV: DTC245200517
# Môn: Triển khai và Quản trị Hệ thống Phần mềm
# ==============================================================

# Khai báo Upstream
upstream blog_backend {
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream phpmyadmin_backend {
    server phpmyadmin:80;
}

# ==============================================================
# HARDENING: RATE LIMITING (CHỐNG DDOS VÀ BRUTE FORCE)
# ==============================================================
# Giới hạn tần suất chung: 15 request/giây trên mỗi IP
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=15r/s;

# Giới hạn nghiêm ngặt cho trang đăng nhập Quản trị: tối đa 5 request/phút (chống Brute-force)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;

    # ==========================================================
    # HARDENING: ẨN THÔNG TIN PHIÊN BẢN MÁY CHỦ (SERVER TOKENS)
    # Ngăn chặn attacker thu thập thông tin phiên bản Nginx
    # ==========================================================
    server_tokens off;

    # ==========================================================
    # HARDENING: CẤU HÌNH CÁC SECURITY HEADERS TIÊU CHUẨN OWASP
    # ==========================================================
    # Chống Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Chống MIME-type Sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Bật bộ lọc XSS của trình duyệt
    add_header X-XSS-Protection "1; mode=block" always;

    # Chính sách Referrer an toàn
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (CSP) cho phép load styles từ Google Fonts & ảnh Unsplash
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://images.unsplash.com;" always;

    # Giới hạn kích thước file upload tối đa (ngăn chặn DoS tràn bộ nhớ)
    client_max_body_size 15M;

    # ==========================================================
    # CẤU HÌNH TỐI ƯU HÓA TỐC ĐỘ (GZIP COMPRESSION)
    # ==========================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # ==========================================================
    # ROUTE 1: TRANG ĐĂNG NHẬP CMS (ÁP DỤNG RATE LIMITING ĐẶC BIỆT)
    # ==========================================================
    location /admin/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # ROUTE 2: PHPMYADMIN (QUẢN LÝ CƠ SỞ DỮ LIỆU)
    # ==========================================================
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # ROUTE 3: NGINX STATUS (CHO NGINX PROMETHEUS EXPORTER)
    # ==========================================================
    location /stub_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        # Trong Docker network cho phép scrape
    }

    # ==========================================================
    # ROUTE 4: ỨNG DỤNG BLOG CMS CHÍNH (DEFAULT PROXY PASS)
    # ==========================================================
    location / {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
