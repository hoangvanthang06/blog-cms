# ==============================================================
# NGINX REVERSE PROXY & HARDENING CONFIGURATION
# Sinh vien: Hoang Van Thang - MSV: DTC245200517
# Mon: Trien khai va Quan tri He thong Phan mem
# ==============================================================

# Khai bao Upstream
upstream blog_backend {
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream phpmyadmin_backend {
    server phpmyadmin:80;
}

# ==============================================================
# HARDENING: RATE LIMITING (CHONG DDOS VA BRUTE FORCE)
# ==============================================================
# Gioi han tan suat chung: 15 request/giay tren moi IP
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=15r/s;

# Gioi han cho trang dang nhap Quan tri: toi da 5 request/phut
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;

    # ==========================================================
    # HARDENING: AN THONG TIN PHIEN BAN MAY CHU (SERVER TOKENS)
    # Ngan chan attacker thu thap thong tin phien ban Nginx
    # ==========================================================
    server_tokens off;

    # ==========================================================
    # HARDENING: CAU HINH CAC SECURITY HEADERS TIEU CHUAN OWASP
    # ==========================================================
    # Chong Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Chong MIME-type Sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Bat bo loc XSS cua trinh duyet
    add_header X-XSS-Protection "1; mode=block" always;

    # Chinh sach Referrer an toan
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (CSP)
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://images.unsplash.com;" always;

    # Gioi han kich thuoc file upload toi da
    client_max_body_size 15M;

    # ==========================================================
    # CAU HINH TOI UU HOA TOC DO (GZIP COMPRESSION)
    # ==========================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # ==========================================================
    # ROUTE 1: TRANG DANG NHAP CMS (RATE LIMITING)
    # ==========================================================
    location /admin/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # ROUTE 2: PHPMYADMIN (QUAN LY CO SO DU LIEU)
    # ==========================================================
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # ROUTE 3: NGINX STATUS (CHO NGINX PROMETHEUS EXPORTER)
    # ==========================================================
    location /stub_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
    }

    # ==========================================================
    # ROUTE 4: UNG DUNG BLOG CMS CHINH (DEFAULT PROXY PASS)
    # ==========================================================
    location / {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
