# ==============================================================
# PROMETHEUS CONFIGURATION
# Giám sát Hệ thống Blog / CMS - Hoàng Văn Thắng DTC245200517
# ==============================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Thu thập metrics từ ứng dụng Node.js Blog CMS
  - job_name: 'blog_cms_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']
        labels:
          app: 'blog_cms'
          env: 'production'

  # 2. Thu thập metrics từ máy chủ Nginx Reverse Proxy
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']
        labels:
          role: 'reverse_proxy'

  # 3. Thu thập metrics từ CSDL MySQL
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld_exporter:9104']
        labels:
          db: 'mysql_primary'

  # 4. Tự giám sát Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
