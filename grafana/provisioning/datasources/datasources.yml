apiVersion: 1

datasources:
  # 1. Kết nối nguồn Prometheus
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # 2. Kết nối nguồn Grafana Loki
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
